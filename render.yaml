services:
  # -----------------------------
  # 1. API Gateway
  # -----------------------------
  - type: web
    name: alphaxai-gateway
    env: python
    region: oregon
    plan: free
    rootDir: . # Change to root to ensure consistent context, though apps/gateway is fine usually.
    # Python build command needs to go into the directory or use pip with path
    buildCommand: cd apps/gateway && pip install -r requirements.txt
    # Start command must also be relative
    startCommand: cd apps/gateway && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AUTH_SERVICE_URL
        fromService:
          type: web
          name: alphaxai-auth
          property: host
      - key: INVENTORY_SERVICE_URL
        fromService:
          type: web
          name: alphaxai-inventory
          property: host
      - key: ORGANIZATION_SERVICE_URL
        fromService:
          type: web
          name: alphaxai-organization
          property: host
      - key: PYTHON_VERSION
        value: 3.11.0

  # -----------------------------
  # 2. Auth Service
  # -----------------------------
  - type: web
    name: alphaxai-auth
    env: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build -w services/auth
    startCommand: cd services/auth && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alphaxai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  # -----------------------------
  # 3. Inventory Service
  # -----------------------------
  - type: web
    name: alphaxai-inventory
    env: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build -w services/inventory
    startCommand: cd services/inventory && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alphaxai-db
          property: connectionString

  # -----------------------------
  # 4. Organization Service
  # -----------------------------
  - type: web
    name: alphaxai-organization
    env: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build -w services/organization
    startCommand: cd services/organization && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alphaxai-db
          property: connectionString

  # -----------------------------
  # 5. Worker
  # -----------------------------
  - type: web
    name: alphaxai-worker
    env: python
    region: oregon
    plan: free
    rootDir: . # Run from root
    buildCommand: cd services/worker && pip install -r requirements.txt
    startCommand: cd services/worker && python main.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alphaxai-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: alphaxai-db
    region: oregon
    plan: free
    databaseName: inventory_saas
    user: alphaxai_user
