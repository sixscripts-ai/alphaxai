services:
  # -----------------------------
  # 1. API Gateway (Entry Point)
  # -----------------------------
  - type: web
    name: alphaxai-gateway
    env: python
    region: oregon
    plan: free
    rootDir: apps/gateway
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AUTH_SERVICE_URL
        fromService:
          type: web
          name: alphaxai-auth
          property: host
      - key: INVENTORY_SERVICE_URL
        fromService:
          type: web
          name: alphaxai-inventory
          property: host
      - key: ORGANIZATION_SERVICE_URL
        fromService:
          type: web
          name: alphaxai-organization
          property: host

  # -----------------------------
  # 2. Auth Service
  # -----------------------------
  - type: web
    name: alphaxai-auth
    env: node
    region: oregon
    plan: free
    rootDir: services/auth
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alphaxai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  # -----------------------------
  # 3. Inventory Service
  # -----------------------------
  - type: web
    name: alphaxai-inventory
    env: node
    region: oregon
    plan: free
    rootDir: services/inventory
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alphaxai-db
          property: connectionString

  # -----------------------------
  # 4. Organization Service
  # -----------------------------
  - type: web
    name: alphaxai-organization
    env: node
    region: oregon
    plan: free
    rootDir: services/organization
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alphaxai-db
          property: connectionString

  # -----------------------------
  # 5. Worker (Background Jobs)
  # -----------------------------
  - type: worker
    name: alphaxai-worker
    env: python
    region: oregon
    plan: free
    rootDir: services/worker
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alphaxai-db
          property: connectionString

databases:
  - name: alphaxai-db
    region: oregon
    plan: free # Note: Render free tier DB expires after 90 days
    databaseName: inventory_saas
    user: alphaxai_user

# Note: Redis and RabbitMQ are not included in the free tier blueprint easily.
# For a production setup, you would add a Redis instance here.
