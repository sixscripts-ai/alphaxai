services:
  # -----------------------------
  # 1. API Gateway
  # -----------------------------
  - type: web
    name: alphaxai-gateway
    env: python
    region: oregon
    plan: free
    rootDir: . # Change to root to ensure consistent context, though apps/gateway is fine usually.
    # Python build command needs to go into the directory or use pip with path
    buildCommand: cd apps/gateway && pip install -r requirements.txt
    # Start command must also be relative
    startCommand: cd apps/gateway && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # NOTE: fromService property:host requires paid private networking.
      # On free plan, use the public .onrender.com URLs directly.
      - key: AUTH_SERVICE_URL
        value: https://alphaxai-auth.onrender.com
      - key: INVENTORY_SERVICE_URL
        value: https://alphaxai-inventory.onrender.com
      - key: ORGANIZATION_SERVICE_URL
        value: https://alphaxai-organization.onrender.com
      - key: WORKER_SERVICE_URL
        value: https://alphaxai-worker.onrender.com
      - key: SUPPLIERS_SERVICE_URL
        value: https://alphaxai-suppliers.onrender.com
      - key: TEAM_SERVICE_URL
        value: https://alphaxai-team.onrender.com
      - key: SHIPMENTS_SERVICE_URL
        value: https://alphaxai-shipments.onrender.com
      - key: PYTHON_VERSION
        value: 3.11.0

  # -----------------------------
  # 2. Auth Service
  # -----------------------------
  - type: web
    name: alphaxai-auth
    env: node
    region: oregon
    plan: free
    rootDir: .
    # Build shared packages first, then the service, then apply DB schema
    buildCommand: npm install && npm run build -w packages/database && npm run build -w packages/logger && npm run build -w services/auth && cd services/auth && npm run db:migrate
    startCommand: cd services/auth && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alphaxai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  # -----------------------------
  # 3. Inventory Service
  # -----------------------------
  - type: web
    name: alphaxai-inventory
    env: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build -w packages/database && npm run build -w packages/logger && npm run build -w services/inventory
    startCommand: cd services/inventory && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alphaxai-db
          property: connectionString

  # -----------------------------
  # 4. Organization Service
  # -----------------------------
  - type: web
    name: alphaxai-organization
    env: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build -w packages/database && npm run build -w packages/logger && npm run build -w services/organization
    startCommand: cd services/organization && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alphaxai-db
          property: connectionString

  # -----------------------------
  # 5. Worker
  # -----------------------------
  - type: web
    name: alphaxai-worker
    env: python
    region: oregon
    plan: free
    rootDir: . # Run from root
    buildCommand: cd services/worker && pip install -r requirements.txt
    startCommand: cd services/worker && python main.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alphaxai-db
          property: connectionString
      - key: OLLAMA_API_KEY
        value: a0ab9e13b25f434faa0c67d79a0ef08d.zeYmXn9Mq8tQkU0SWwU24T0q
      - key: PYTHON_VERSION
        value: 3.11.0

  # -----------------------------
  # 6. Suppliers Service
  # -----------------------------
  - type: web
    name: alphaxai-suppliers
    env: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build -w packages/database && npm run build -w packages/logger && npm run build -w services/suppliers
    startCommand: cd services/suppliers && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alphaxai-db
          property: connectionString

  # -----------------------------
  # 7. Team Service
  # -----------------------------
  - type: web
    name: alphaxai-team
    env: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build -w packages/database && npm run build -w packages/logger && npm run build -w services/team
    startCommand: cd services/team && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alphaxai-db
          property: connectionString

  # -----------------------------
  # 8. Shipments Service
  # -----------------------------
  - type: web
    name: alphaxai-shipments
    env: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build -w packages/database && npm run build -w packages/logger && npm run build -w services/shipments
    startCommand: cd services/shipments && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alphaxai-db
          property: connectionString

databases:
  - name: alphaxai-db
    region: oregon
    plan: free
    databaseName: inventory_saas
    user: alphaxai_user
