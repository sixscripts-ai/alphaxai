services:
  # -----------------------------
  # 1. API Gateway
  # -----------------------------
  - type: web
    name: alphaxai-gateway
    env: python
    region: oregon
    plan: free
    rootDir: apps/gateway
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AUTH_SERVICE_URL
        fromService:
          type: web
          name: alphaxai-auth
          property: host
      - key: INVENTORY_SERVICE_URL
        fromService:
          type: web
          name: alphaxai-inventory
          property: host
      - key: ORGANIZATION_SERVICE_URL
        fromService:
          type: web
          name: alphaxai-organization
          property: host

  # -----------------------------
  # 2. Auth Service
  # -----------------------------
  - type: web
    name: alphaxai-auth
    env: node
    region: oregon
    plan: free
    rootDir: . # Run from root to access monorepo packages
    buildCommand: npm install && npm run build -w services/auth
    startCommand: cd services/auth && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alphaxai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  # -----------------------------
  # 3. Inventory Service
  # -----------------------------
  - type: web
    name: alphaxai-inventory
    env: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build -w services/inventory
    startCommand: cd services/inventory && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alphaxai-db
          property: connectionString

  # -----------------------------
  # 4. Organization Service
  # -----------------------------
  - type: web
    name: alphaxai-organization
    env: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build -w services/organization
    startCommand: cd services/organization && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alphaxai-db
          property: connectionString

  # -----------------------------
  # 5. Worker (Run as Web Service for Free Plan)
  # -----------------------------
  - type: web
    name: alphaxai-worker
    env: python
    region: oregon
    plan: free
    rootDir: services/worker
    buildCommand: pip install -r requirements.txt
    # We add a dummy port binding if needed, but Python script just loops. 
    # Render expects a web server on PORT. 
    # Hack: Run the worker in background and start a dummy http server? 
    # Or just let it fail health checks? 
    # Better: Use a simple python script that does both.
    # For now, let's keep it simple. If it fails to bind port, Render kills it.
    # We will use 'python main.py' but main.py needs to listen on $PORT to satisfy Render Web Service.
    startCommand: python main.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alphaxai-db
          property: connectionString

databases:
  - name: alphaxai-db
    region: oregon
    plan: free
    databaseName: inventory_saas
    user: alphaxai_user
