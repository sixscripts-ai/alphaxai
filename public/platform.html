<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlphaX AI Platform</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 40px; background:#0b1020; color:#fff; }
    .card { max-width: 760px; margin: 0 auto; background:#151c33; padding: 24px; border-radius: 12px; }
    input, textarea, button { width: 100%; margin-top: 10px; padding: 12px; border-radius: 8px; border: 1px solid #334; }
    button { background:#4f7cff; color:#fff; font-weight:700; cursor:pointer; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap: 12px; }
    .ok { color:#77f0aa; margin-top:12px; }
    .err { color:#ff8f8f; margin-top:12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>AlphaX AI Enterprise Platform</h1>
    <p>Live platform form backed by Turso.</p>

    <form id="leadForm">
      <div class="row">
        <input id="name" placeholder="Name" required />
        <input id="email" type="email" placeholder="Work Email" required />
      </div>
      <input id="company" placeholder="Company" />
      <textarea id="message" rows="5" placeholder="What are you trying to build?"></textarea>
      <button type="submit">Start Enterprise Setup</button>
    </form>

    <div id="status"></div>
  </div>

  <script>
    const form = document.getElementById('leadForm');
    const statusEl = document.getElementById('status');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      statusEl.className = '';
      statusEl.textContent = 'Submitting...';

      const payload = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        company: document.getElementById('company').value,
        message: document.getElementById('message').value
      };

      try {
        const response = await fetch('/api/platform/leads', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || 'Failed to submit');
        }

        statusEl.className = 'ok';
        statusEl.textContent = 'Success! We saved your setup request.';
        form.reset();
      } catch (error) {
        statusEl.className = 'err';
        statusEl.textContent = error.message;
      }
    });
  </script>
</body>
</html>
